<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Review Classifier</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f4f7f9;
      color: #333;
    }

    header {
      background: #3949ab;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header img {
      height: 40px;
      vertical-align: middle;
      margin-right: 10px;
    }

    .container {
      max-width: 600px;
      background: white;
      margin: 40px auto;
      padding: 30px 40px;
      border-radius: 10px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    }

    textarea {
      width: 100%;
      height: 120px;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
      resize: vertical;
    }

    button {
      background: #3949ab;
      color: white;
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.3s ease;
    }

    button:hover {
      background: #303f9f;
    }

    .result {
      margin-top: 25px;
      padding: 15px;
      border-radius: 6px;
      background: #e8f0fe;
      font-size: 17px;
      font-weight: bold;
    }

    .result p {
      margin: 0;
    }

    .footer {
      margin-top: 40px;
      text-align: center;
      font-size: 14px;
      color: #777;
    }
  </style>
</head>
<body>

  <header>
    <img src="https://cdn-icons-png.flaticon.com/512/4228/4228703.png" alt="AI Logo">
    <strong>Product Review Classifier</strong>
  </header>

  <div class="container">
    <form id="reviewForm">
      <label for="review"><strong>Enter your product review:</strong></label><br><br>
      <textarea id="review" name="review" placeholder="E.g., The Zoom call was lagging and audio kept cutting out." required></textarea><br>
      <button type="submit">Classify</button>
    </form>

    <div id="result" class="result" style="display: none;"></div>
  </div>



  <script>
    document.getElementById("reviewForm").addEventListener("submit", async function (e) {
      e.preventDefault();
      const review = document.getElementById("review").value;
      const response = await fetch("/predict", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ review: review })
      });

      const data = await response.json();
      const resultDiv = document.getElementById("result");
      resultDiv.style.display = "block";

      if (data.error) {
        resultDiv.innerHTML = `<p style="color:red;">Error: ${data.error}</p>`;
      } else {
        resultDiv.innerHTML = `
          <p>🧠 <strong>Sentiment:</strong> ${data.sentiment}</p>
          ${data.issue ? `<p>⚠️ <strong>Issue Type:</strong> ${data.issue}</p>` : `<p>✅ No issue detected</p>`}
        `;
      }
    });
  </script>

</body>
</html>
